services:
  hub:
    build: .
    container_name: novai-toy-hub
    restart: unless-stopped
    init: true
    environment:
      TOY_HUB_TOKEN: ${TOY_HUB_TOKEN:?Set a private Hub token}
      TOY_HUB_MAX_SECONDS: 300
      TOY_HUB_PUBLIC_URL: ${TOY_HUB_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:13737:3737"
    networks:
      coolify:
        aliases:
          - novai-toy-hub
    volumes:
      - toy_hub_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
networks:
  coolify:
    external: true
volumes:
  toy_hub_data:
